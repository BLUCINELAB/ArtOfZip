<!doctype html>
<html lang="it">
<head>
  <!--
    Gabinetto di Psicostratigrafia
    Sito statico per GitHub Pages.
    Tutto è generato in HTML/CSS/JavaScript vanilla.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabinetto di Psicostratigrafia — Anton Zip</title>
  <meta name="description" content="Uno strumento di esplorazione archeologica della mente creativa di Anton Zip. Pensieri, progetti e frammenti come sedimenti geologici.">
  <meta name="theme-color" content="#d4c5b9">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/stratigraphy.css">
  <link rel="stylesheet" href="css/core.css">
</head>

<body>
  <a class="skip-link" href="#surface">Vai alla superficie di campionamento</a>

  <main
    id="surface"
    class="surface"
    tabindex="0"
    role="application"
    aria-label="Superficie minerale interattiva. Clicca o tocca un punto per prelevare una carota psicostratigrafica. Doppio click o pressione lunga per aprire il pannello profondità."
  >
    <h1 class="visually-hidden">Gabinetto di Psicostratigrafia</h1>

    <div id="custom-cursor" class="geologist-lens" aria-hidden="true"></div>

    <div id="ripple-layer" class="ripple-layer" aria-hidden="true"></div>

    <section class="surface-caption" aria-live="polite">
      <span>Gabinetto di Psicostratigrafia</span>
      <span class="caption-divider" aria-hidden="true">—</span>
      <button id="sample-question" class="sample-question" type="button">
        Prelevare campione?
      </button>
    </section>

    <section
      id="carota-container"
      class="carota-container"
      aria-label="Area delle carote di sedimento generate"
    ></section>

    <aside
      id="pannello-profondita"
      class="depth-panel"
      aria-hidden="true"
      aria-label="Pannello profondità di scavo"
    >
      <div class="depth-panel__handle" aria-hidden="true"></div>

      <header class="depth-panel__header">
        <h2>Profondità di scavo</h2>
        <button id="close-panel" class="icon-button" type="button" aria-label="Chiudi pannello profondità">×</button>
      </header>

      <div class="depth-options" role="group" aria-label="Seleziona profondità temporale">
        <button class="depth-option is-active" type="button" data-depth="quaternario">
          <strong>Quaternario</strong>
          <span>recente / mobile / non consolidato</span>
        </button>

        <button class="depth-option" type="button" data-depth="cretaceo">
          <strong>Cretaceo</strong>
          <span>medio / compresso / ricorsivo</span>
        </button>

        <button class="depth-option" type="button" data-depth="archeano">
          <strong>Archeano</strong>
          <span>profondo / primario / opaco</span>
        </button>
      </div>

      <div class="scale-switcher" aria-label="Scala temporale">
        <span>Scala temporale</span>
        <div class="scale-buttons" role="group" aria-label="Tipo di scala temporale">
          <button class="scale-button is-active" type="button" data-scale="lineare">lineare</button>
          <button class="scale-button" type="button" data-scale="emotiva">emotiva</button>
          <button class="scale-button" type="button" data-scale="caotica">caotica</button>
        </div>
      </div>

      <button id="random-core" class="random-core" type="button">
        Carota casuale
      </button>
    </aside>
  </main>

  <section
    id="thin-section-view"
    class="thin-section-view"
    aria-hidden="true"
    aria-label="Sezione sottile del campione"
  >
    <header class="thin-section-header">
      <div>
        <p class="kicker">Sezione sottile</p>
        <h2 id="thin-section-title">Pensiero fossilizzato</h2>
      </div>
      <button id="close-section" class="icon-button icon-button--light" type="button" aria-label="Chiudi sezione sottile">×</button>
    </header>

    <canvas
      id="sezione-sottile"
      class="thin-section-canvas"
      aria-label="Campione minerale generato proceduralmente"
    ></canvas>

    <div class="thin-section-footer">
      <span id="section-coordinates">campione: non prelevato</span>
      <span>ESC per chiudere</span>
    </div>
  </section>

  <div id="tooltip" class="fossil-tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="js/core-simulation.js"></script>
  <script src="js/strata-manager.js"></script>
  <script src="js/sezione-sottile.js"></script>
  <script src="js/carotaggio.js"></script>
  <script src="js/interactions.js"></script>
</body>
</html>
